[project]
name = "saakshya-cv"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "opencv-python-headless>=4.10",
  "numpy>=1.26",
  "httpx>=0.27",
  "cloudinary>=1.41",
  "pydantic>=2.9",
]

[project.optional-dependencies]
dev = ["pytest>=8.3"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
